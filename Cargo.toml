[package]
name = "zigistry"
version = "0.0.1"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
futures = "0.3.31"
tokio = { version = "1.49.0", features = ["full"] }

lazy_static = "1.5.0"
reqwest = { version = "0.13.1", features = ["json"] }
chrono = "0.4.43"

serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.149"
serde_with = "3.16.1"
toml = "0.9.11"
libsql = "0.9.29"
dotenv = "0.15.0"
env_logger = "0.11.9"
