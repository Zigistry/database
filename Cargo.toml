[package]
name = "zigistry"
version = "0.0.1"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
futures = "0.3.31"
tokio = { version = "1.48.0", features = ["full"] }

lazy_static = "1.5.0"
reqwest = { version = "0.12.26", features = ["json"] }
chrono = "0.4.42"

serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.145"
serde_with = "3.16.1"
regex = "1.12.2"
toml = "0.9.10"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "macros"] }
stop-words = "0.9.0"
keyword_extraction = "1.5.0"
libsql = "0.9.29"
