name: Run Python Scripts Hourly

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: macos-latest
    env:
      GH_API_KEY: ${{ secrets.GH_API_KEY }}
      HF_AUTH_TOKEN: ${{ secrets.HF_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python scripts
        run: |
          python ./src/indexSectionsFetcher.py
          python ./src/packagesFetcher.py
          python ./src/programsFetcher.py

      - name: Create dataset and push to Hugging Face
        run: |
          python ./src/createPushDatasetComplete.py
          python ./src/createPushDatasetPackages.py
          python ./src/createPushDatasetPrograms.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated update from GitHub Actions"
          git push --no-verify