# I will be passing the repository names on this
# and will be using to add them to the main
# database for sections.
query RepoInfo($owner_name: String!, $repo_name: String!) {
  repository(owner: $owner_name, name: $repo_name) {
    ...RepoFields
  }
}

fragment RepoFields on Repository {
  name
  description
  issues {
    totalCount
  }
  defaultBranchRef {
    name
  }
  forkCount
  stargazerCount
  watchers {
    totalCount
  }
  pushedAt
  createdAt
  isArchived
  isDisabled
  isFork
  licenseInfo {
    spdxId
  }
  owner {
    avatarUrl
    login
    ... on User {
      bio
      company
      followers {
        totalCount
      }
      following {
        totalCount
      }
      location
    }
    ... on Organization {
      description
      location
      websiteUrl
    }
  }
  repositoryTopics(first: 7) {
    edges {
      node {
        topic {
          name
        }
      }
    }
  }
  releases(first: 10, orderBy: { field: CREATED_AT, direction: DESC }) {
    nodes {
      tagName
      isPrerelease
      publishedAt
      releaseAssets(first: 10) {
        nodes {
          name
          downloadUrl
          size
          contentType
        }
      }
    }
  }
  primaryLanguage {
    name
  }
}
